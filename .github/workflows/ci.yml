name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci

      # --- .NET schema extractor -------------------------------------------------
      # The schema-connection ticket adds `dotnet publish -c Release` here and
      # copies the CLI output into extension/assets/ before the bundle step.
      # Intentionally a no-op today so the shape of the job is already visible.
      - name: Build schema extractor (placeholder)
        run: echo "No schema extractor yet — added by the schema-connection ticket."

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Core tests
        run: npm run test:core

      - name: Bundle (host + webview)
        run: npm run build

      - name: Activation smoke test
        run: xvfb-run -a npm run test:smoke

      - name: Package VSIX
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: ss14editor-vsix
          path: extension/*.vsix
          if-no-files-found: error
